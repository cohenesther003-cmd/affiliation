<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>גלאי קורות קיר עם 13 חיישנים ואיתור חוטים חיים — המוצרים שלי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  
  <style>
    * { box-sizing: border-box; }
    body {
      background: #F7F7F7;
      font-family: 'Heebo', 'Segoe UI', Arial, sans-serif;
      color: #1C1C1E;
      margin: 0;
    }

    /* ── Navbar ── */
    .site-nav {
      background: #fff;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      border-bottom: 1px solid #F0F0F0;
    }
    .site-nav .navbar-brand {
      font-size: 1.3rem;
      font-weight: 900;
      background: linear-gradient(90deg, #FF6B35, #FF9A5C);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
    }
    .site-nav .nav-link {
      color: #4A4A4A !important;
      font-weight: 600;
      font-size: .95rem;
      padding: .8rem .9rem;
      border-bottom: 3px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .site-nav .nav-link:hover,
    .site-nav .nav-link.active {
      color: #FF6B35 !important;
      border-bottom-color: #FF6B35;
    }
    .navbar-toggler { border-color: #E0E0E0; }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%280%2C0%2C0%2C.6%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(135deg, #FF6B35 0%, #FF9A5C 50%, #FFB347 100%);
      color: #fff;
      text-align: center;
      padding: 28px 24px 24px;
    }
    .hero h1 {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .hero p { color: rgba(255,255,255,.88); font-size: .9rem; margin: 0; }

    /* ── Hero (compact) ── */
    .hero {
      background: linear-gradient(135deg, #FF6B35 0%, #FF9A5C 50%, #FFB347 100%);
      color: #fff;
      text-align: center;
      padding: 28px 24px 24px;
    }
    .hero h1 {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .hero p { color: rgba(255,255,255,.88); font-size: .9rem; margin: 0; }

    /* ── Page layout: sidebar + grid ── */
    .page-layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      padding: 28px 0 48px;
    }

    /* ── Sidebar filters ── */
    .filter-sidebar {
      width: 220px;
      flex-shrink: 0;
      position: sticky;
      top: 70px;
    }
    .filter-sidebar h2 {
      font-size: .7rem;
      font-weight: 800;
      color: #AEAEB2;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 16px;
    }
    .filter-section {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,.06);
    }
    .filter-section-title {
      font-size: .72rem;
      font-weight: 800;
      color: #AEAEB2;
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 10px;
    }
    .search-box {
      width: 100%;
      border: 1.5px solid #E5E5EA;
      border-radius: 10px;
      padding: 9px 12px;
      font-family: 'Heebo', sans-serif;
      font-size: .9rem;
      outline: none;
      direction: rtl;
      transition: border-color .15s;
    }
    .search-box:focus { border-color: #FF6B35; }
    .filter-chips { display: flex; flex-direction: column; gap: 6px; }
    .chip {
      background: #F2F2F7;
      color: #3A3A3C;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-family: 'Heebo', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: right;
      transition: background .15s, color .15s;
    }
    .chip:hover { background: #FFE8DF; color: #FF6B35; }
    .chip.active { background: #FF6B35; color: #fff; }
    #results-count {
      font-size: .78rem;
      color: #AEAEB2;
      font-weight: 500;
      text-align: center;
      padding: 8px 0 0;
    }

    /* ── Product grid ── */
    .grid-area { flex: 1; min-width: 0; }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    @media (max-width: 1100px) {
      .product-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 767px) {
      .page-layout { flex-direction: column; }
      .filter-sidebar { width: 100%; position: static; }
      .filter-chips { flex-direction: row; flex-wrap: wrap; }
      .chip { padding: 5px 12px; }
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    @media (max-width: 479px) {
      .product-grid { grid-template-columns: 1fr; }
    }
    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: #AEAEB2;
      font-size: 1rem;
      display: none;
      grid-column: 1/-1;
    }

    /* ── Product card ── */
    .product-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform .2s, box-shadow .2s;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 28px rgba(0,0,0,.13);
      color: inherit;
      text-decoration: none;
    }
    .product-card .card-img {
      width: 100%;
      height: 260px;
      object-fit: contain;
      background: #F2F2F7;
      padding: 16px;
    }
    .product-card .card-body {
      padding: 14px 16px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .product-card .card-name {
      font-size: .95rem;
      font-weight: 700;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-card .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
    }
    .badge-rating {
      background: #FFF3CD;
      color: #856404;
      font-size: .78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .card-price {
      font-size: .9rem;
      font-weight: 700;
      color: #1C1C1E;
    }
    .category-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #FF6B35;
      color: #fff;
      font-size: .68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    /* ── Product detail page ── */
    .product-detail {
      max-width: 700px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #6E6E73;
      text-decoration: none;
      font-size: .9rem;
      margin-bottom: 24px;
      transition: color .15s;
    }
    .back-link:hover { color: #FF6B35; }
    .detail-img-wrap {
      background: #F2F2F7;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 28px;
      box-shadow: 0 4px 16px rgba(0,0,0,.07);
    }
    .detail-img-wrap img {
      max-width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 10px;
    }
    .detail-title {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 14px;
    }
    .detail-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .detail-meta .price-tag {
      font-size: 1.25rem;
      font-weight: 800;
      color: #1C1C1E;
    }
    .detail-meta .reviews-count {
      color: #6E6E73;
      font-size: .88rem;
    }
    .divider { border: none; border-top: 1px solid #E5E5EA; margin: 20px 0; }
    .detail-desc {
      font-size: 1rem;
      line-height: 1.85;
      color: #3A3A3C;
      margin-bottom: 32px;
    }
    .buy-btn {
      display: block;
      width: 100%;
      background: #FFD814;
      color: #0F1111;
      font-family: 'Heebo', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 15px 32px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background .15s, transform .1s;
    }
    .buy-btn:hover {
      background: #F7CA00;
      color: #0F1111;
      transform: translateY(-1px);
    }
    .buy-btn:active { transform: translateY(0); }

    /* ── Static pages (about / contact / terms) ── */
    .static-page {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 16px 80px;
    }
    .static-card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      line-height: 1.85;
    }
    .static-card h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 20px; }
    .static-card p { color: #3A3A3C; }
    .wip-badge {
      display: inline-block;
      background: #FFF3CD;
      color: #856404;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: .9rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* ── Footer ── */
    .site-footer {
      background: #FFF8F5;
      color: #8A8A8E;
      text-align: center;
      padding: 28px 16px;
      font-size: .82rem;
      border-top: 1px solid #F0E8E4;
    }
    .site-footer a { color: #FF6B35; text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }
  </style>

  
</head>
